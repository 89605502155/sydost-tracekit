name: publish

# Publishes to PyPI with trusted publishing (no API token): create the project
# "sydost-tracekit" on PyPI and add this repository and workflow as a trusted publisher.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uv publish --trusted-publishing always
