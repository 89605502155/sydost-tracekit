[project]
name = "sydost-tracekit"
version = "0.0.1"
description = "Reference memory traces of virtual machines and accuracy of accumulated-deficit estimates from samples: stdlib guest recorder, libvirt collector, error bounds, tuning by Pareto front"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Andrey Ferubko", email = "ferubko1999@yandex.ru" },
    { name = "Oleg Kazakov", email = "kazakov@bgitu.ru" },
]
requires-python = ">=3.11"
keywords = [
    "memory-trace",
    "virtualization",
    "kvm",
    "libvirt",
    "sampling",
    "integral",
    "deficit",
    "error-bound",
    "monitoring",
    "tuning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
kvm = ["libvirt-python>=8.0"]

[project.scripts]
sydost-tracekit = "sydost_tracekit.cli:main"

[project.urls]
Homepage = "https://github.com/89605502155/sydost-tracekit"
Documentation = "https://github.com/89605502155/sydost-tracekit/tree/main/docs"
Repository = "https://github.com/89605502155/sydost-tracekit"
Issues = "https://github.com/89605502155/sydost-tracekit/issues"
Changelog = "https://github.com/89605502155/sydost-tracekit/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.uv.build-backend]
# The source distribution also carries the tests, documentation and examples.
source-include = [
    "tests/**",
    "docs/**",
    "examples/**",
    "experiments/**",
    "scripts/**",
    "conftest.py",
    "README.ru.md",
    "CHANGELOG.md",
    "CITATION.cff",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "D", "UP", "B", "A", "C4", "EM", "ISC", "PIE", "PT",
    "RET", "SIM", "TID", "ARG", "PTH", "PGH", "T20", "PERF", "FURB", "NPY", "PL", "RUF", "S",
]
ignore = [
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0913", # too many arguments: the functions mirror the notation of the paper
    "PLR0917", # too many positional arguments: the same
    "PLR0915", # too many statements
    "PLR2004", # magic values: the constants are those of the paper and of the formats
    "PLC0415", # imports inside functions keep optional dependencies optional
    "EM101", "EM102", # messages of the errors are short and inline
    "PTH123", "PTH118", # open() with explicit newline and encoding is the clearer form here
]
# Greek letters and mathematical signs in docstrings are formulas, not typos.
allowed-confusables = ["ν", "α", "ρ", "σ", "γ", "ℓ", "×", "−", "–", "θ", "λ", "η", "κ", "ξ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D", "S101", "PLR2004", "PLR0917", "T20", "N802", "N803", "N806", "PERF", "PT011", "PT018",
    "ARG001", "ARG002", "ARG005", "N815",
    "RUF001", "RUF002", "RUF003",  # Cyrillic text of the documentation and of the messages
]
"examples/**" = ["D", "T20", "S101", "INP001"]
"experiments/**" = ["D", "T20", "S101", "INP001"]
"scripts/**" = ["D", "T20", "INP001", "S603", "S607"]  # the hook calls git and python
"conftest.py" = ["D"]
"src/sydost_tracekit/bounds.py" = ["N803", "N806", "N815"]  # V, L, M, K, T: the notation of the paper
"src/sydost_tracekit/synthetic.py" = ["N803"]  # T: the length of the trace in the paper
"src/sydost_tracekit/trace.py" = ["N802"]  # T: the length of the trace
"src/sydost_tracekit/cli.py" = ["T20"]  # the command line prints its results
"src/sydost_tracekit/recorder.py" = ["T20", "PLR0913"]  # the guest script prints its summary

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["sydost_tracekit"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--doctest-modules",
    "--import-mode=importlib",
    "-m",
    "not slow",
]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS", "NUMBER"]
markers = [
    "slow: long runs (minutes); run with -m slow",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["sydost_tracekit"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "\\.\\.\\.$",
]

[tool.mypy]
python_version = "3.11"
files = ["src/sydost_tracekit"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["libvirt", "libvirt.*"]
ignore_missing_imports = true
